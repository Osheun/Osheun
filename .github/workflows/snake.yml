name: Generate Snake

on:
  # Mise à jour automatique toutes les 12h
  schedule:
    - cron: "0 */12 * * *"
  # Permet de lancer manuellement depuis l'onglet Actions
  workflow_dispatch:
  # Lance aussi à chaque push sur main
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Génération de l'animation snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark

      - name: Publication sur la branche output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
